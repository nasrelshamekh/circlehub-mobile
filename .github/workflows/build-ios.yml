name: Build Sideloadable iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_API_URL: https://circlehub.runasp.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Swift tools compatibility
        run: |
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} + 2>/dev/null || true

      - name: Generate iOS native project via Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build & Archive iOS App
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found in ios directory"
            ls -la
            exit 1
          fi

          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Found workspace: $WORKSPACE with inferred scheme: $SCHEME"
          xcodebuild -list -workspace "$WORKSPACE"

          ARCHIVE_PATH="build/$SCHEME.xcarchive"
          echo "Archiving to $ARCHIVE_PATH..."

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into Sideloadable IPA
        run: |
          cd ios
          ARCHIVE_APP=$(find build -name "*.app" | head -n 1)
          if [ -z "$ARCHIVE_APP" ]; then
            echo "Error: Archive app directory not found"
            find build
            exit 1
          fi

          echo "Found app bundle at: $ARCHIVE_APP"
          mkdir -p ipa_build/Payload
          cp -R "$ARCHIVE_APP" ipa_build/Payload/
          cd ipa_build
          zip -qr ../../CircleHub.ipa Payload
          cd ../..
          ls -lh CircleHub.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleHub-iOS-IPA
          path: CircleHub.ipa
          if-no-files-found: error
          retention-days: 14
