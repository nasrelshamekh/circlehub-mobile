name: Build Sideloadable iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_API_URL: https://circlehub.runasp.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS native project via Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build & Archive iOS App
        run: |
          cd ios
          WORKSPACE="CircleHub.xcworkspace"
          SCHEME="CircleHub"
          ARCHIVE_PATH="build/CircleHub.xcarchive"
          
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME..."
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into Sideloadable IPA
        run: |
          cd ios
          ARCHIVE_APP="build/CircleHub.xcarchive/Products/Applications/CircleHub.app"
          
          if [ ! -d "$ARCHIVE_APP" ]; then
            echo "Error: Archive app directory not found at $ARCHIVE_APP"
            find build -name "*.app"
            ARCHIVE_APP=$(find build -name "*.app" | head -n 1)
          fi
          
          echo "Found app bundle at: $ARCHIVE_APP"
          mkdir -p ipa_build/Payload
          cp -R "$ARCHIVE_APP" ipa_build/Payload/
          cd ipa_build
          zip -qr ../../CircleHub.ipa Payload
          cd ../..
          ls -lh CircleHub.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleHub-iOS-IPA
          path: CircleHub.ipa
          if-no-files-found: error
          retention-days: 14
